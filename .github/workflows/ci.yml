name: CI

# Until now nothing checked anything. Every regression this session was caught
# by hand, which does not scale and does not survive anyone being busy.
#
# WHY THIS IS SMALL. It gates on the two things that pass cleanly today --
# typecheck and tests -- and reports lint without failing on it. There are 855
# pre-existing lint errors; a gate that is red on arrival gets ignored within a
# week, and an ignored gate is worse than none because it looks like coverage.
# Fix the lint backlog, then flip lint to blocking.
#
# WHY NO BUILD STEP. `npm run build` runs prebuild (sitemap generation) and
# postbuild (prerendering 1,700 routes), both of which need live Supabase
# credentials. Those are deliberately not in this repo, and the sitemap
# generator now exits non-zero when they are missing -- correctly, because a
# silently truncated sitemap is the bug it was written to prevent. Putting a
# read key into CI to work around that trades a real secret for a weaker check
# than the tests already give.

on:
  push:
    branches: [main, shikshaq-2.0]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Not `tsc --noEmit`. The root tsconfig is `"files": []` with project
      # references, so --noEmit checks nothing at all and passes on a codebase
      # that does not compile. This has already cost time once.
      - name: Typecheck
        run: npx tsc -b

      - name: Tests
        run: npm test

      - name: Lint (reported, not enforced)
        run: npx eslint .
        continue-on-error: true
